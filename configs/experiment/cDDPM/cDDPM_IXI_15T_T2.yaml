# @package _global_

# Conditional DDPM for IXI 1.5T T2-only dataset
# python run.py experiment=cDDPM/cDDPM_IXI_15T_T2.yaml

defaults:
  - override /trainer: default.yaml
  - override /model: DDPM_2D.yaml
  - override /datamodule: IXI_15T_T2.yaml

datamodule:
  cfg:
    rescaleFactor: 2
    imageDim: [192, 192, 100]
    mode: t2
    aug_intensity: True

model:
  cfg:
    test_timesteps: 500
    dim_mults: [1, 2, 2]
    unet_dim: 128
    objective: pred_x0
    loss: l1
    residualmode: l1
    OpenaiUnet: True
    conv_resample: True
    noisetype: simplex
    dropout_unet: 0.0
    condition: True
    pretrained_backbone: True
    backbone: resnet18

num_folds: 5

logger:
  wandb:
    project: Conditioned-Diffusion-Models-UAD

ckpt_path: best

trainer:
  max_epochs: 1600
  precision: 32
  devices: 4
  accelerator: gpu
  strategy: ddp

name: cDDPM_IXI_15T_T2
seed: 3141
